<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Bazm">
  <title>Bazm — likobcha monogrammasi</title>
  <!--
    1-VARIANT: LIKOBCHA.
    Ilovaning o'zida taom rasmi yo'q bo'lganda ATAYLAB chizilgan likobcha
    ko'rsatiladi (oltin halqa + bosh harf). Logotip ham xuddi shu tildan
    olingan — ya'ni belgi mahsulotning ichidan o'sib chiqqan, ustiga
    yopishtirilgan emas.
    Halqadagi uzilish — likobchaga tushgan yorug'lik.
  -->
  <defs>
    <linearGradient id="l1" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e0c288"/>
      <stop offset="1" stop-color="#a97f3c"/>
    </linearGradient>
  </defs>

  <!-- Tashqi chekka -->
  <circle cx="60" cy="60" r="53" fill="none" stroke="url(#l1)" stroke-width="3"/>

  <!-- Ichki halqa: tepa-o'ngda uzilish (yorug'lik aksi) -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#l1)" stroke-width="1.4"
          opacity="0.5" stroke-linecap="round"
          stroke-dasharray="150 40 70 4" stroke-dashoffset="30"/>

  <!-- Monogramma -->
  <text x="60" y="61" text-anchor="middle" dominant-baseline="central"
        font-family="Fraunces, Georgia, 'Times New Roman', serif"
        font-size="52" font-weight="700" fill="url(#l1)">B</text>
</svg>
